name: DWI recover v11

on:
  push:
    branches: [codex/dwi-authoritative-rebuild]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate pinned runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"

      - name: Recover audited DWI dependency closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dwl"
          git clone --depth 1 https://github.com/vinodsalina-cpu/dwl.git "$RUNNER_TEMP/dwl"

          rm -rf apps/dwi-host apps/dwi-webview packages/dwi-core packages/domain/prompt-optimizer packages/domain/workspace
          mkdir -p apps packages/domain scripts tests/extension-host .github/workflows
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-host" apps/dwi-host
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-webview" apps/dwi-webview
          cp -R "$RUNNER_TEMP/dwl/packages/dwi-core" packages/dwi-core
          cp -R "$RUNNER_TEMP/dwl/packages/domain/prompt-optimizer" packages/domain/prompt-optimizer
          cp -R "$RUNNER_TEMP/dwl/packages/domain/workspace" packages/domain/workspace
          cp "$RUNNER_TEMP/dwl/tsconfig.base.json" tsconfig.base.json
          cp "$RUNNER_TEMP/dwl/tsconfig.plugin.json" tsconfig.plugin.json
          rm -f .bootstrap

          cat > package.json <<'JSON'
          {
            "name": "@platform/dwi-root",
            "version": "0.1.0",
            "private": true,
            "packageManager": "pnpm@11.17.0",
            "engines": { "node": "24.18.0", "pnpm": "11.17.0" },
            "volta": { "node": "24.18.0", "pnpm": "11.17.0" },
            "scripts": {
              "build:deps": "pnpm --filter @platform/domain-prompt-optimizer build && pnpm --filter @platform/domain-workspace build && pnpm --filter @platform/dwi-core build && pnpm --filter @platform/dwi-webview build",
              "build": "pnpm build:deps && pnpm --filter @platform/dwi-host build",
              "test": "pnpm build:deps && pnpm --filter @platform/domain-prompt-optimizer exec vitest run --config vitest.config.ts && pnpm --filter @platform/domain-workspace exec vitest run && pnpm --filter @platform/dwi-core exec vitest run && pnpm --filter @platform/dwi-host test && pnpm --filter @platform/dwi-webview test",
              "vsix": "pnpm build && node apps/dwi-host/scripts/package-vsix.mjs",
              "verify:extension": "node scripts/verify-installed-extension.mjs"
            },
            "devDependencies": {
              "@types/node": "^24.13.3",
              "@vscode/test-electron": "2.5.2",
              "typescript": "^5.9.3",
              "vitest": "~4.1.10"
            },
            "workspaces": [
              "apps/dwi-host",
              "apps/dwi-webview",
              "packages/dwi-core",
              "packages/domain/prompt-optimizer",
              "packages/domain/workspace"
            ]
          }
          JSON

          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - apps/dwi-host
            - apps/dwi-webview
            - packages/dwi-core
            - packages/domain/prompt-optimizer
            - packages/domain/workspace
          allowBuilds:
            '@swc/core': true
            '@vscode/vsce-sign': true
            keytar: true
          YAML

          printf '24.18.0\n' > .nvmrc
          printf 'nodejs 24.18.0\npnpm 11.17.0\n' > .tool-versions

          cat > .gitignore <<'EOF'
          node_modules/
          **/node_modules/
          dist/
          **/dist/
          coverage/
          **/coverage/
          .pnpm-store/
          .vite/
          **/.vite/
          .vscode-test/
          *.tsbuildinfo
          *.vsix
          .DS_Store
          .env
          .env.*
          !.env.example
          .dwi/
          .dwi.*
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/dwi-host/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.description = 'Local, consent-based project intelligence with project-aware Prompt Optimizer and optional provider configuration.';
          manifest.engines.node = '24.18.0';
          manifest.repository = { type: 'git', url: 'https://github.com/vinodsalina-cpu/dwi.git' };
          manifest.files = ['dist/**', 'media/**', 'README.md'];
          manifest.capabilities = {
            untrustedWorkspaces: {
              supported: true,
              description: 'DWI reads only bounded manifest/config evidence after explicit project consent and does not execute workspace code.'
            }
          };
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          cat > apps/dwi-host/scripts/assemble.mjs <<'EOF'
          import { cp, copyFile, mkdir, readFile, readdir, rm, writeFile } from "node:fs/promises";
          import { dirname, join } from "node:path";
          import { fileURLToPath } from "node:url";
          const app = fileURLToPath(new URL("..", import.meta.url));
          const root = fileURLToPath(new URL("../../..", import.meta.url));
          const dist = join(app, "dist");
          async function runtime(path, name) {
            const source = join(root, path);
            const target = join(dist, "node_modules", ...name.split("/"));
            await rm(target, { recursive: true, force: true });
            await mkdir(join(target, "dist"), { recursive: true });
            await writeFile(join(target, "package.json"), await readFile(join(source, "package.json")));
            await cp(join(source, "dist"), join(target, "dist"), {
              recursive: true,
              filter: (entry) => !entry.endsWith(".d.ts") && !entry.endsWith(".d.ts.map") && !entry.endsWith(".tsbuildinfo")
            });
          }
          async function asset(name) {
            const source = join(root, "dist/apps/dwi-webview", name);
            const target = join(dist, name);
            await mkdir(dirname(target), { recursive: true });
            await copyFile(source, target);
          }
          async function prune(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) await prune(path);
              else if (entry.name.endsWith(".d.ts") || entry.name.endsWith(".d.ts.map") || entry.name.endsWith(".tsbuildinfo")) await rm(path, { force: true });
            }
          }
          await Promise.all([
            runtime("packages/dwi-core", "@platform/dwi-core"),
            runtime("packages/domain/prompt-optimizer", "@platform/domain-prompt-optimizer"),
            runtime("packages/domain/workspace", "@platform/domain-workspace"),
            asset("dwi-webview.js"),
            asset("dwi-webview.css")
          ]);
          await prune(dist);
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/dwi-webview/src/compose-layout.spec.ts')
          p.write_text(p.read_text().replace('readFile("apps/dwi-webview/src/compose.css", "utf8")', 'readFile("src/compose.css", "utf8")'))
          p = Path('apps/dwi-webview/src/main.spec.tsx')
          s = p.read_text()
          s = s.replace('import React from "react";', 'import React, { act } from "react";')
          s = s.replace('document.body.innerHTML = \'<div id="root"></div>\'; await import("./main.js");', 'document.body.innerHTML = \'<div id="root"></div>\'; await act(async () => { await import("./main.js"); });')
          s = s.replace('window.dispatchEvent(new MessageEvent("message", { data: { type: "dwi.error", message: "Open a workspace before creating a project brief." } }));', 'await act(async () => { window.dispatchEvent(new MessageEvent("message", { data: { type: "dwi.error", message: "Open a workspace before creating a project brief." } })); });')
          p.write_text(s)
          PY

          cat > scripts/verify-installed-extension.mjs <<'EOF'
          import { downloadAndUnzipVSCode, runTests } from '@vscode/test-electron';
          import { mkdtemp, mkdir, readdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';
          const root = resolve(fileURLToPath(new URL('..', import.meta.url)));
          const vsix = join(root, 'apps/dwi-host/developer-work-intelligence-0.1.0.vsix');
          const sandbox = await mkdtemp(join(tmpdir(), 'dwi-vscode-'));
          const extensionsDir = join(sandbox, 'extensions');
          const userDataDir = join(sandbox, 'user-data');
          const workspaceDir = join(sandbox, 'workspace');
          await Promise.all([mkdir(extensionsDir), mkdir(userDataDir), mkdir(workspaceDir)]);
          await writeFile(join(workspaceDir, 'package.json'), JSON.stringify({
            name: 'dwi-smoke-workspace', private: true, packageManager: 'pnpm@11.17.0',
            scripts: { build: 'tsc -p tsconfig.json', test: 'vitest run' },
            devDependencies: { typescript: '^5.9.3', vitest: '^4.1.10' }
          }, null, 2));
          await writeFile(join(workspaceDir, 'tsconfig.json'), JSON.stringify({ compilerOptions: { target: 'ES2022', module: 'NodeNext', moduleResolution: 'NodeNext' }, include: ['src'] }, null, 2));
          await mkdir(join(workspaceDir, 'src'));
          await writeFile(join(workspaceDir, 'src/index.ts'), 'export const answer = 42;\n');
          await writeFile(join(workspaceDir, 'README.md'), '# DWI smoke workspace\nA small TypeScript workspace used to verify packaged DWI activation.\n');
          const vscodeExecutablePath = await downloadAndUnzipVSCode('1.134.0');
          const ciElectronArgs = process.platform === 'linux' && process.env.CI === 'true' ? ['--no-sandbox'] : [];
          const install = spawnSync(vscodeExecutablePath, [...ciElectronArgs, '--install-extension', vsix, '--force', '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir], { stdio: 'inherit' });
          if (install.status !== 0) throw new Error(`VSIX installation failed with status ${install.status}`);
          const installed = (await readdir(extensionsDir)).find((name) => name.startsWith('dwi-poc.developer-work-intelligence-'));
          if (!installed) throw new Error('Installed DWI extension directory was not found.');
          await runTests({
            vscodeExecutablePath,
            extensionDevelopmentPath: join(extensionsDir, installed),
            extensionTestsPath: join(root, 'tests/extension-host/index.cjs'),
            launchArgs: [workspaceDir, ...ciElectronArgs, '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir, '--disable-workspace-trust']
          });
          EOF

          cat > tests/extension-host/index.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const vscode = require('vscode');
          async function run() {
            const extension = vscode.extensions.getExtension('dwi-poc.developer-work-intelligence');
            assert.ok(extension, 'DWI extension is discoverable after VSIX installation');
            await extension.activate();
            assert.equal(extension.isActive, true, 'DWI extension activates');
            const commands = await vscode.commands.getCommands(true);
            assert.ok(commands.includes('dwi.open'), 'dwi.open command is registered');
            await vscode.commands.executeCommand('dwi.open');
            await new Promise((resolve) => setTimeout(resolve, 1500));
            assert.ok(extension.isActive, 'DWI remains active after opening its view');
          }
          module.exports = { run };
          EOF

      - name: Generate standalone lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Three clean build and test passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "=== clean verification pass $pass ==="
            rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build
            pnpm vsix
            test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          done

      - name: Inspect runtime-only VSIX
        shell: bash
        run: |
          set -euo pipefail
          V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'VSIX_BYTES=%s' "$V"
          unzip -l "$V" | tee /tmp/dwi-vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/dwi-vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env|\.d\.ts|tsconfig\.tsbuildinfo' /tmp/dwi-vsix.txt

      - name: Install activate and open packaged DWI
        run: xvfb-run -a pnpm verify:extension

      - name: Repository independence and public hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='dwi-recover-*.yml' '(\.\./dwl|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook|file:\.\./|link:\.\./)' .
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .

      - name: Write executable README and permanent CI
        shell: bash
        run: |
          set -euo pipefail
          cat > README.md <<'EOF'
          # Developer Workspace Intelligence (DWI)

          Developer Workspace Intelligence is a VS Code extension that creates a local, consent-based project brief from bounded workspace evidence and uses it to provide project-aware prompt and tool guidance. Core DWI operation is local; provider configuration is optional.

          ## Prerequisites

          - Node.js **24.18.0**
          - pnpm **11.17.0**
          - VS Code **1.125.0 or newer**
          - Git

          Node is pinned in `.nvmrc` and `.tool-versions`; pnpm is pinned in `package.json`.

          ## Clone

          ```sh
          git clone https://github.com/vinodsalina-cpu/dwi.git
          cd dwi
          ```

          ## Select the pinned runtime

          With `nvm`:

          ```sh
          nvm install
          nvm use
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node --version
          pnpm --version
          ```

          Expected versions are `v24.18.0` and `11.17.0`.

          ## Install dependencies

          ```sh
          pnpm install --frozen-lockfile
          ```

          ## Build DWI

          ```sh
          pnpm build
          ```

          This builds the Prompt Optimizer domain, workspace intelligence domain, DWI core, React/Vite webview and VS Code extension host in dependency order.

          ## Build the VSIX

          ```sh
          pnpm vsix
          ```

          The installable package is created at:

          ```text
          apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          ```

          ## Install in VS Code

          In VS Code, open **Extensions**, open the `...` menu, choose **Install from VSIX...**, select the generated file above, and reload if prompted.

          Verified CLI installation command:

          ```sh
          code --install-extension apps/dwi-host/developer-work-intelligence-0.1.0.vsix --force
          ```

          ## Start DWI

          Open a project in VS Code. Select **Developer Work Intelligence** in the Activity Bar, or run **DWI: Open Developer Work Intelligence** / **Open Developer Work Intelligence** from the Command Palette.

          ## What to expect

          DWI begins at a project-scoped consent screen. It does not perform its bounded workspace inspection until consent is granted. After approval, DWI derives a local project brief from permitted project evidence. Confirm or correct the brief, select the DWI modules needed for the task, compose project-aware guidance, and review the resulting output. Provider settings are optional and stored through VS Code's secret/configuration facilities where applicable.

          ## Troubleshooting

          If `pnpm install --frozen-lockfile` reports a runtime mismatch, use Node 24.18.0 and pnpm 11.17.0 exactly. If packaging fails after a partial build, remove generated `dist` directories and rerun `pnpm build` followed by `pnpm vsix`. If VS Code does not show DWI after installation, confirm the VSIX installed successfully, reload VS Code, open a workspace, and run the DWI open command from the Command Palette. Build output and generated VSIX files are intentionally ignored and must be regenerated from source.

          ## Agent Troubleshooting Context

          DWI is a five-workspace pnpm repository: `apps/dwi-host`, `apps/dwi-webview`, `packages/dwi-core`, `packages/domain/prompt-optimizer`, and `packages/domain/workspace`. `dwi-host` is the VS Code extension entrypoint; it assembles the built webview and the three required local runtime packages into its `dist` tree before `vsce` packages the extension. `dwi-core` depends on Prompt Optimizer; the host depends on DWI core and workspace intelligence; the webview depends on DWI core. Build/runtime must never depend on `dwl`, a sibling checkout, pre-existing `dist`, or uncommitted generated files. The canonical verification path is frozen install → tests → build → VSIX → archive inspection → packaged-extension install/activation/open.
          EOF

          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify DWI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24.18.0
                - name: Activate pinned pnpm
                  run: |
                    corepack enable
                    corepack prepare pnpm@11.17.0 --activate
                - name: Frozen install
                  run: pnpm install --frozen-lockfile
                - name: Tests
                  run: pnpm test
                - name: Build and package
                  run: pnpm vsix
                - name: Inspect VSIX
                  run: |
                    set -euo pipefail
                    V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
                    test -f "$V"
                    unzip -l "$V" | tee /tmp/vsix.txt
                    grep -q 'extension/dist/extension.js' /tmp/vsix.txt
                    grep -q 'extension/dist/dwi-webview.js' /tmp/vsix.txt
                    grep -q 'extension/dist/dwi-webview.css' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/vsix.txt
                    ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env|\.d\.ts|tsconfig\.tsbuildinfo' /tmp/vsix.txt
                - name: Install activate and open packaged extension
                  run: xvfb-run -a pnpm verify:extension
                - uses: actions/upload-artifact@v4
                  with:
                    name: dwi-vsix
                    path: apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          EOF

      - name: Commit standalone source and remove recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          rm -f .github/workflows/dwi-recover-and-verify.yml .github/workflows/dwi-recover-v2.yml .github/workflows/dwi-recover-v3.yml .github/workflows/dwi-recover-v4.yml .github/workflows/dwi-recover-v5.yml .github/workflows/dwi-recover-v6.yml .github/workflows/dwi-recover-v7.yml .github/workflows/dwi-recover-v8.yml .github/workflows/dwi-recover-v9.yml .github/workflows/dwi-recover-v10.yml .github/workflows/dwi-recover-v11.yml
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild

      - name: Fresh clone documented build and runtime path
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          unzip -l apps/dwi-host/developer-work-intelligence-0.1.0.vsix | grep -q 'extension/dist/extension.js'
          xvfb-run -a pnpm verify:extension
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
