name: DWI recover v2

on:
  push:
    branches: [codex/dwi-authoritative-rebuild]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
      - name: Recover DWI source closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dwl"
          git clone --depth 1 https://github.com/vinodsalina-cpu/dwl.git "$RUNNER_TEMP/dwl"
          rm -rf apps/dwi-host apps/dwi-webview packages/dwi-core packages/domain/prompt-optimizer packages/domain/workspace
          mkdir -p apps packages/domain scripts tests/extension-host .github/workflows
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-host" apps/dwi-host
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-webview" apps/dwi-webview
          cp -R "$RUNNER_TEMP/dwl/packages/dwi-core" packages/dwi-core
          cp -R "$RUNNER_TEMP/dwl/packages/domain/prompt-optimizer" packages/domain/prompt-optimizer
          cp -R "$RUNNER_TEMP/dwl/packages/domain/workspace" packages/domain/workspace
          cp "$RUNNER_TEMP/dwl/tsconfig.base.json" tsconfig.base.json
          cp "$RUNNER_TEMP/dwl/tsconfig.plugin.json" tsconfig.plugin.json
          rm -f .bootstrap

          cat > package.json <<'JSON'
          {
            "name": "@platform/dwi-root",
            "version": "0.1.0",
            "private": true,
            "packageManager": "pnpm@11.17.0",
            "engines": { "node": "24.18.0", "pnpm": "11.17.0" },
            "volta": { "node": "24.18.0", "pnpm": "11.17.0" },
            "pnpm": {
              "onlyBuiltDependencies": ["@swc/core", "@vscode/vsce-sign", "keytar"]
            },
            "scripts": {
              "build:deps": "pnpm --filter @platform/domain-prompt-optimizer build && pnpm --filter @platform/domain-workspace build && pnpm --filter @platform/dwi-core build && pnpm --filter @platform/dwi-webview build",
              "build": "pnpm build:deps && pnpm --filter @platform/dwi-host build",
              "test": "pnpm --filter @platform/domain-prompt-optimizer exec vitest run --config vitest.config.ts && pnpm --filter @platform/domain-workspace exec vitest run && pnpm --filter @platform/dwi-core exec vitest run && pnpm --filter @platform/dwi-host test && pnpm --filter @platform/dwi-webview test",
              "vsix": "pnpm build && node apps/dwi-host/scripts/package-vsix.mjs",
              "verify:extension": "node scripts/verify-installed-extension.mjs"
            },
            "devDependencies": {
              "@types/node": "^24.13.3",
              "@vscode/test-electron": "2.5.2",
              "typescript": "^5.9.3",
              "vitest": "~4.1.10"
            },
            "workspaces": [
              "apps/dwi-host",
              "apps/dwi-webview",
              "packages/dwi-core",
              "packages/domain/prompt-optimizer",
              "packages/domain/workspace"
            ]
          }
          JSON

          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - apps/dwi-host
            - apps/dwi-webview
            - packages/dwi-core
            - packages/domain/prompt-optimizer
            - packages/domain/workspace
          YAML
          printf '24.18.0\n' > .nvmrc
          printf 'nodejs 24.18.0\npnpm 11.17.0\n' > .tool-versions
          cat > .gitignore <<'EOF'
          node_modules/
          **/node_modules/
          dist/
          **/dist/
          coverage/
          **/coverage/
          .pnpm-store/
          .vite/
          **/.vite/
          *.tsbuildinfo
          *.vsix
          .DS_Store
          .env
          .env.*
          !.env.example
          .dwi/
          .dwi.*
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const p = 'apps/dwi-host/package.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          m.description = 'Local, consent-based project intelligence with project-aware Prompt Optimizer and optional provider configuration.';
          m.engines.node = '24.18.0';
          m.capabilities = { untrustedWorkspaces: { supported: true, description: 'DWI reads only bounded manifest/config evidence after explicit project consent and does not execute workspace code.' } };
          fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          NODE

          cat > scripts/verify-installed-extension.mjs <<'EOF'
          import { downloadAndUnzipVSCode, runTests } from '@vscode/test-electron';
          import { mkdtemp, mkdir, readdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';
          const root = resolve(fileURLToPath(new URL('..', import.meta.url)));
          const vsix = join(root, 'apps/dwi-host/developer-work-intelligence-0.1.0.vsix');
          const sandbox = await mkdtemp(join(tmpdir(), 'dwi-vscode-'));
          const extensionsDir = join(sandbox, 'extensions');
          const userDataDir = join(sandbox, 'user-data');
          const workspaceDir = join(sandbox, 'workspace');
          await Promise.all([mkdir(extensionsDir), mkdir(userDataDir), mkdir(workspaceDir)]);
          await writeFile(join(workspaceDir, 'package.json'), JSON.stringify({ name: 'dwi-smoke-workspace', private: true, packageManager: 'pnpm@11.17.0', scripts: { build: 'echo build', test: 'echo test' }, devDependencies: { typescript: '^5.9.3' } }, null, 2));
          await writeFile(join(workspaceDir, 'README.md'), '# DWI smoke workspace\n');
          const vscodeExecutablePath = await downloadAndUnzipVSCode('stable');
          const install = spawnSync(vscodeExecutablePath, ['--install-extension', vsix, '--force', '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir], { stdio: 'inherit' });
          if (install.status !== 0) throw new Error(`VSIX installation failed with status ${install.status}`);
          const installed = (await readdir(extensionsDir)).find((name) => name.startsWith('dwi-poc.developer-work-intelligence-'));
          if (!installed) throw new Error('Installed DWI extension directory was not found.');
          await runTests({ vscodeExecutablePath, extensionDevelopmentPath: join(extensionsDir, installed), extensionTestsPath: join(root, 'tests/extension-host/index.cjs'), launchArgs: [workspaceDir, '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir, '--disable-workspace-trust'] });
          EOF
          cat > tests/extension-host/index.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const vscode = require('vscode');
          async function run() {
            const extension = vscode.extensions.getExtension('dwi-poc.developer-work-intelligence');
            assert.ok(extension, 'DWI extension is discoverable from installed VSIX contents');
            await extension.activate();
            assert.equal(extension.isActive, true, 'DWI extension activates');
            const commands = await vscode.commands.getCommands(true);
            assert.ok(commands.includes('dwi.open'), 'dwi.open command is registered');
            await vscode.commands.executeCommand('dwi.open');
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          module.exports = { run };
          EOF

          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify DWI
          on: [push, pull_request]
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24.18.0
                - run: |
                    corepack enable
                    corepack prepare pnpm@11.17.0 --activate
                - run: pnpm install --frozen-lockfile
                - run: pnpm test
                - run: pnpm vsix
                - name: Inspect VSIX
                  run: |
                    set -euo pipefail
                    V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
                    unzip -l "$V" | tee /tmp/vsix.txt
                    grep -q 'extension/dist/extension.js' /tmp/vsix.txt
                    grep -q 'extension/dist/dwi-webview.js' /tmp/vsix.txt
                    grep -q 'extension/dist/dwi-webview.css' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/vsix.txt
                    ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env' /tmp/vsix.txt
                - run: xvfb-run -a pnpm verify:extension
                - uses: actions/upload-artifact@v4
                  with:
                    name: dwi-vsix
                    path: apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          EOF

      - name: Generate reduced lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
      - name: Fresh frozen install, tests and package
        run: |
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
          pnpm install --frozen-lockfile
          pnpm test
          pnpm vsix
      - name: Inspect VSIX
        shell: bash
        run: |
          set -euo pipefail
          V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          test -f "$V"
          stat -c 'VSIX_BYTES=%s' "$V"
          unzip -l "$V" | tee /tmp/vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env' /tmp/vsix.txt
      - name: Install and activate VSIX
        run: xvfb-run -a pnpm verify:extension
      - name: Independence and public hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='dwi-recover-and-verify.yml' --exclude='dwi-recover-v2.yml' '(\.\./dwl|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook|file:\.\./|link:\.\./)' .
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .
      - name: Write executable README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Developer Workspace Intelligence (DWI)

          Developer Workspace Intelligence is a VS Code extension for local, consent-based workspace intelligence. It builds an evidence-backed project brief, lets the developer confirm or correct it, composes project-aware prompt/tool guidance, and keeps managed DWI state local. Provider configuration is optional; the core flow is deterministic and does not require the old DWL repository.

          ## Prerequisites

          - Node.js **24.18.0**
          - pnpm **11.17.0**
          - VS Code **1.125.0 or newer**
          - Git

          Node is pinned in `.nvmrc` and `.tool-versions`; pnpm is pinned in `package.json`.

          ## Clone

          ```sh
          git clone https://github.com/vinodsalina-cpu/dwi.git
          cd dwi
          ```

          ## Select the pinned runtime

          With nvm:

          ```sh
          nvm install
          nvm use
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node --version
          pnpm --version
          ```

          Expected versions are `v24.18.0` and `11.17.0`.

          ## Install dependencies

          ```sh
          pnpm install --frozen-lockfile
          ```

          pnpm is configured with a narrow build-script allowlist for the native/build-time packages required by the DWI toolchain (`@swc/core`, `@vscode/vsce-sign`, and `keytar`). Do not replace this with a global build-script bypass.

          ## Build

          ```sh
          pnpm build
          ```

          This builds the Prompt Optimizer domain, workspace domain, DWI core, Vite/React webview, and VS Code host in dependency order, then assembles the runtime workspace packages and webview assets into the host `dist` directory.

          ## Build/package the VSIX

          ```sh
          pnpm vsix
          ```

          Output:

          ```text
          apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          ```

          ## Install in VS Code

          UI: open **Extensions** → `...` → **Install from VSIX...** and select the file above. Reload if prompted.

          Verified CLI form:

          ```sh
          code --install-extension apps/dwi-host/developer-work-intelligence-0.1.0.vsix --force
          ```

          ## Start DWI

          Open a project/workspace in VS Code. Select the **Developer Work Intelligence** Activity Bar icon, or run **Open Developer Work Intelligence** from the Command Palette (`dwi.open`).

          ## What to expect

          The normal flow is **initial/consent → brief → compose → review/usable**. DWI first explains the bounded evidence categories and waits for approval. After approval it creates a local project brief from approved manifest/config/script evidence; the developer confirms or corrects it. The compose view selects DWI work modules and compiles project-aware guidance. The review view shows the local candidate, optional feedback/evaluation export, and can resume managed local `.dwi` state. Multi-root workspaces require choosing a root. Optional provider keys are stored with VS Code SecretStorage.

          ## Verification

          ```sh
          pnpm test
          pnpm verify:extension
          ```

          `pnpm verify:extension` expects the VSIX to have been produced by `pnpm vsix`. It downloads a disposable VS Code through `@vscode/test-electron`, installs the VSIX into an isolated extensions directory, activates DWI, verifies `dwi.open`, and opens the DWI view against a disposable workspace. Linux CI runs this through `xvfb-run`.

          ## Troubleshooting

          **Frozen install fails with a lockfile mismatch:** confirm the checkout is current and pnpm is exactly `11.17.0`. Do not bypass `--frozen-lockfile`; regenerate and commit the lockfile only when manifests intentionally change.

          **pnpm reports an ignored build script:** do not enable all dependency scripts. The repository intentionally allows only the exact toolchain packages listed under `pnpm.onlyBuiltDependencies` in the root `package.json`.

          **The DWI webview is blank or an asset is missing:** run `pnpm build`. `apps/dwi-host/dist/` must contain `extension.js`, `dwi-webview.js`, `dwi-webview.css`, and runtime packages under `dist/node_modules/@platform/`.

          **DWI asks for a workspace:** open a folder or `.code-workspace` before approving project analysis. This is an intentional boundary.

          **Multi-root setup does not continue automatically:** select the project root in DWI. Managed `.dwi` state is isolated per selected root.

          **Saving provider settings makes no provider call:** intentional. The current DWI implementation validates/stores optional configuration locally; setup does not silently test or invoke the provider.

          ## Agent Troubleshooting Context

          - Build/runtime closure: `apps/dwi-host` → `packages/dwi-core` + `packages/domain/workspace`; `packages/dwi-core` → `packages/domain/prompt-optimizer`; `apps/dwi-webview` → `packages/dwi-core`.
          - Webview output: `dist/apps/dwi-webview/dwi-webview.js` and `dwi-webview.css`.
          - Host assembly: `apps/dwi-host/scripts/assemble.mjs` copies built webview assets and built workspace runtime packages into `apps/dwi-host/dist/`.
          - Packaging: `apps/dwi-host/scripts/package-vsix.mjs` stages the extension manifest/README, icon, and assembled `dist` tree and packages them with `@vscode/vsce`.
          - Runtime entry: `apps/dwi-host/dist/extension.js`; command `dwi.open`; view `dwi-view`; container `dwi-sidebar`.
          - VSIX path: `apps/dwi-host/developer-work-intelligence-0.1.0.vsix`.
          - Generated `dist`, coverage, caches, `node_modules`, `.dwi` runtime state, and `.vsix` files are ignored and reproducible.
          - The final source has no build/runtime dependency on `dwl`; DWL was used only once as the recovery source for reconstructing this standalone repository.
          EOF
      - name: Commit recovered repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          rm -f .github/workflows/dwi-recover-and-verify.yml .github/workflows/dwi-recover-v2.yml
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild
      - name: Fresh-clone README accuracy gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
