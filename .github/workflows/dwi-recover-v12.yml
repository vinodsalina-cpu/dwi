name: DWI recover v12

on:
  push:
    branches: [codex/dwi-authoritative-rebuild]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate pinned runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"

      - name: Recover the already-audited DWI closure
        shell: bash
        run: |
          set -euo pipefail
          git show 43f4b07acbf1d58fbe1d08ac13dc5ebf7ef3d1ef:.github/workflows/dwi-recover-v11.yml > /tmp/v11.yml
          ruby -e 'require "yaml"; y=YAML.load_file("/tmp/v11.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Recover audited DWI dependency closure"}; abort("recovery step missing") unless s; File.write("/tmp/recover.sh",s["run"])'
          bash -euo pipefail /tmp/recover.sh

      - name: Replace packaged-extension verifier with bounded CLI install
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/verify-installed-extension.mjs <<'EOF'
          import { downloadAndUnzipVSCode, runTests } from '@vscode/test-electron';
          import { mkdtemp, mkdir, readdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { dirname, join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('..', import.meta.url)));
          const vsix = join(root, 'apps/dwi-host/developer-work-intelligence-0.1.0.vsix');
          const sandbox = await mkdtemp(join(tmpdir(), 'dwi-vscode-'));
          const extensionsDir = join(sandbox, 'extensions');
          const userDataDir = join(sandbox, 'user-data');
          const workspaceDir = join(sandbox, 'workspace');
          await Promise.all([mkdir(extensionsDir), mkdir(userDataDir), mkdir(workspaceDir)]);

          await writeFile(join(workspaceDir, 'package.json'), JSON.stringify({
            name: 'dwi-smoke-workspace',
            private: true,
            packageManager: 'pnpm@11.17.0',
            scripts: { build: 'tsc -p tsconfig.json', test: 'vitest run' },
            devDependencies: { typescript: '^5.9.3', vitest: '^4.1.10' }
          }, null, 2));
          await writeFile(join(workspaceDir, 'tsconfig.json'), JSON.stringify({
            compilerOptions: { target: 'ES2022', module: 'NodeNext', moduleResolution: 'NodeNext' },
            include: ['src']
          }, null, 2));
          await mkdir(join(workspaceDir, 'src'));
          await writeFile(join(workspaceDir, 'src/index.ts'), 'export const answer = 42;\n');
          await writeFile(join(workspaceDir, 'README.md'), '# DWI smoke workspace\nA small TypeScript workspace used to verify packaged DWI activation.\n');

          const vscodeExecutablePath = await downloadAndUnzipVSCode('1.134.0');
          const vscodeCliPath = process.platform === 'win32'
            ? vscodeExecutablePath
            : join(dirname(vscodeExecutablePath), 'bin', 'code');
          const ciElectronArgs = process.platform === 'linux' && process.env.CI === 'true' ? ['--no-sandbox'] : [];

          console.log('DWI_SMOKE_INSTALL_BEGIN');
          const install = spawnSync(vscodeCliPath, [
            ...ciElectronArgs,
            '--install-extension', vsix,
            '--force',
            '--extensions-dir', extensionsDir,
            '--user-data-dir', userDataDir
          ], { stdio: 'inherit', timeout: 120000, killSignal: 'SIGKILL' });
          if (install.error) throw install.error;
          if (install.status !== 0) throw new Error(`VSIX installation failed with status ${install.status}, signal ${install.signal}`);
          console.log('DWI_SMOKE_INSTALL_OK');

          const installed = (await readdir(extensionsDir)).find((name) => name.startsWith('dwi-poc.developer-work-intelligence-'));
          if (!installed) throw new Error('Installed DWI extension directory was not found.');

          await runTests({
            vscodeExecutablePath,
            extensionDevelopmentPath: join(extensionsDir, installed),
            extensionTestsPath: join(root, 'tests/extension-host/index.cjs'),
            launchArgs: [workspaceDir, ...ciElectronArgs, '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir, '--disable-workspace-trust']
          });
          console.log('DWI_SMOKE_EXTENSION_HOST_OK');
          EOF

          cat > tests/extension-host/index.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const vscode = require('vscode');

          async function run() {
            const extension = vscode.extensions.getExtension('dwi-poc.developer-work-intelligence');
            assert.ok(extension, 'DWI extension is discoverable after VSIX installation');
            await extension.activate();
            assert.equal(extension.isActive, true, 'DWI extension activates');
            console.log('DWI_SMOKE_ACTIVATED');
            const commands = await vscode.commands.getCommands(true);
            assert.ok(commands.includes('dwi.open'), 'dwi.open command is registered');
            await vscode.commands.executeCommand('dwi.open');
            await new Promise((resolve) => setTimeout(resolve, 1500));
            assert.ok(extension.isActive, 'DWI remains active after opening its view');
            console.log('DWI_SMOKE_OPEN_OK');
          }

          module.exports = { run };
          EOF

      - name: Clean frozen install tests build and package
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
          rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix

      - name: Inspect runtime-only VSIX
        shell: bash
        run: |
          set -euo pipefail
          V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'VSIX_BYTES=%s' "$V"
          unzip -l "$V" | tee /tmp/dwi-vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/dwi-vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env|\.d\.ts|tsconfig\.tsbuildinfo' /tmp/dwi-vsix.txt

      - name: Install activate and open packaged DWI
        shell: bash
        run: timeout --signal=KILL 240s xvfb-run -a pnpm verify:extension

      - name: Repository independence and public hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='dwi-recover-*.yml' '(\.\./dwl|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook|file:\.\./|link:\.\./)' .
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .

      - name: Write executable README and permanent CI
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; y=YAML.load_file("/tmp/v11.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Write executable README and permanent CI"}; abort("README step missing") unless s; File.write("/tmp/readme.sh",s["run"])'
          bash -euo pipefail /tmp/readme.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify.yml')
          s=p.read_text().replace('run: xvfb-run -a pnpm verify:extension','run: timeout --signal=KILL 240s xvfb-run -a pnpm verify:extension')
          p.write_text(s)
          PY

      - name: Commit standalone source and remove recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          rm -f .github/workflows/dwi-recover*.yml
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild

      - name: Fresh clone documented build and packaged runtime path
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          unzip -l apps/dwi-host/developer-work-intelligence-0.1.0.vsix | grep -q 'extension/dist/extension.js'
          timeout --signal=KILL 240s xvfb-run -a pnpm verify:extension
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
