name: DWI recover v9

on:
  push:
    branches: [codex/dwi-authoritative-rebuild]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate pinned runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"

      - name: Recover audited source and package rules
        shell: bash
        run: |
          set -euo pipefail
          git show 19023e5770d97f492dabcae0d16e2af2c47eaf34:.github/workflows/dwi-recover-v8.yml > /tmp/v8.yml
          ruby -e 'require "yaml"; y=YAML.load_file("/tmp/v8.yml", aliases: true); %w[Recover\ audited\ DWI\ closure Remove\ package-only\ build\ metadata\ and\ support\ CI\ Electron\ sandbox\ boundary].each_with_index{|n,i| s=y["jobs"]["recover"]["steps"].find{|x| x["name"]==n}; File.write("/tmp/step#{i}.sh",s["run"])}'
          bash -euo pipefail /tmp/step0.sh
          bash -euo pipefail /tmp/step1.sh

          cat > scripts/verify-installed-extension.mjs <<'EOF'
          import { downloadAndUnzipVSCode, runTests } from '@vscode/test-electron';
          import { mkdtemp, mkdir, readdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('..', import.meta.url)));
          const vsix = join(root, 'apps/dwi-host/developer-work-intelligence-0.1.0.vsix');
          const sandbox = await mkdtemp(join(tmpdir(), 'dwi-vscode-'));
          const extensionsDir = join(sandbox, 'extensions');
          const userDataDir = join(sandbox, 'user-data');
          const workspaceDir = join(sandbox, 'workspace');
          await Promise.all([mkdir(extensionsDir), mkdir(userDataDir), mkdir(workspaceDir)]);
          await writeFile(join(workspaceDir, 'package.json'), JSON.stringify({
            name: 'dwi-smoke-workspace',
            private: true,
            packageManager: 'pnpm@11.17.0',
            scripts: { build: 'echo build', test: 'echo test' },
            devDependencies: { typescript: '^5.9.3' }
          }, null, 2));
          await writeFile(join(workspaceDir, 'README.md'), '# DWI smoke workspace\n');

          const vscodeExecutablePath = await downloadAndUnzipVSCode('stable');
          const ciElectronArgs = process.platform === 'linux' && process.env.CI === 'true' ? ['--no-sandbox'] : [];
          const install = spawnSync(vscodeExecutablePath, [
            ...ciElectronArgs,
            '--install-extension', vsix,
            '--force',
            '--extensions-dir', extensionsDir,
            '--user-data-dir', userDataDir
          ], { stdio: 'inherit' });
          if (install.status !== 0) throw new Error(`VSIX installation failed with status ${install.status}`);

          const installed = (await readdir(extensionsDir)).find((name) => name.startsWith('dwi-poc.developer-work-intelligence-'));
          if (!installed) throw new Error('Installed DWI extension directory was not found.');

          await runTests({
            vscodeExecutablePath,
            extensionDevelopmentPath: join(extensionsDir, installed),
            extensionTestsPath: join(root, 'tests/extension-host/index.cjs'),
            launchArgs: [workspaceDir, ...ciElectronArgs, '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir, '--disable-workspace-trust']
          });
          EOF

      - name: Generate lock and prove clean source
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
          rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
          pnpm install --frozen-lockfile
          pnpm test
          pnpm vsix

      - name: Inspect runtime-only VSIX
        shell: bash
        run: |
          set -euo pipefail
          V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          test -f "$V"
          stat -c 'VSIX_BYTES=%s' "$V"
          unzip -l "$V" | tee /tmp/dwi-vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/dwi-vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env|\.d\.ts|tsconfig\.tsbuildinfo' /tmp/dwi-vsix.txt

      - name: Install, activate and open packaged DWI
        run: xvfb-run -a pnpm verify:extension

      - name: Repository independence and public hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='dwi-recover-and-verify.yml' --exclude='dwi-recover-v2.yml' --exclude='dwi-recover-v3.yml' --exclude='dwi-recover-v4.yml' --exclude='dwi-recover-v5.yml' --exclude='dwi-recover-v6.yml' --exclude='dwi-recover-v7.yml' --exclude='dwi-recover-v8.yml' --exclude='dwi-recover-v9.yml' '(\.\./dwl|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook|file:\.\./|link:\.\./)' .
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .

      - name: Write verified README and permanent CI
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; y=YAML.load_file("/tmp/v8.yml", aliases: true); %w[Write\ verified\ README Write\ permanent\ verification\ workflow].each_with_index{|n,i| s=y["jobs"]["recover"]["steps"].find{|x| x["name"]==n}; File.write("/tmp/final#{i}.sh",s["run"])}'
          bash -euo pipefail /tmp/final0.sh
          bash -euo pipefail /tmp/final1.sh

      - name: Commit source-only standalone repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist .vscode-test apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          rm -f .github/workflows/dwi-recover-and-verify.yml .github/workflows/dwi-recover-v2.yml .github/workflows/dwi-recover-v3.yml .github/workflows/dwi-recover-v4.yml .github/workflows/dwi-recover-v5.yml .github/workflows/dwi-recover-v6.yml .github/workflows/dwi-recover-v7.yml .github/workflows/dwi-recover-v8.yml .github/workflows/dwi-recover-v9.yml
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild

      - name: Fresh-clone documented build path
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
