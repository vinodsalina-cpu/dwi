name: Verify DWI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm --workspace-root exec node -e 'if (process.version !== "v24.18.0") process.exit(1)'
          pnpm -r --workspace-concurrency=1 exec sh -euc 'test "$(node --version)" = "v24.18.0"; test "$(pnpm --version)" = "11.17.0"'
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Six package typechecks
        run: pnpm -r --workspace-concurrency=1 --if-present typecheck
      - name: Repository-owned language fixtures
        run: pnpm verify:fixtures
      - name: Canonical schema drift
        run: |
          pnpm schema:export
          git diff --exit-code -- docs/project-snapshot.schema.json
      - name: Build and package
        run: pnpm vsix
      - name: Inspect VSIX
        shell: bash
        run: |
          set -euo pipefail
          V=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          test -f "$V"
          stat -c 'VSIX_BYTES=%s' "$V"
          unzip -l "$V" | tee /tmp/vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env|\.d\.ts|tsconfig\.tsbuildinfo' /tmp/vsix.txt
      - name: Install activate and open packaged extension
        env:
          DWI_VSCODE_VERSION: 1.134.0
        run: timeout --signal=KILL 360s xvfb-run -a pnpm verify:extension
      - name: Three-process packaged persistence and routing
        env:
          DWI_VSCODE_VERSION: 1.134.0
        run: timeout --signal=KILL 360s xvfb-run -a pnpm verify:extension:restart
      - name: Advertised minimum VS Code compatibility
        env:
          DWI_VSCODE_VERSION: 1.125.0
        run: timeout --signal=KILL 360s xvfb-run -a pnpm verify:extension
      - name: Repository independence and public hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHECK_FILES < <(find apps packages scripts tests \
            \( -type d \( -name node_modules -o -name dist -o -name coverage -o -name .vscode-test \) -prune \) -o \
            \( -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' -o -name 'package.json' -o -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) ! -name '*.spec.ts' ! -name '*.spec.tsx' -print \) | sort)
          CHECK_FILES+=(package.json pnpm-workspace.yaml tsconfig.base.json tsconfig.plugin.json README.md AGENTS.md docs/prompt-optimizer-program/context.md docs/prompt-optimizer-program/expected.md docs/prompt-optimizer-program/progress.md docs/prompt-optimizer-program/recovery-evidence.md docs/prompt-optimizer-program/recovery-runbook.md)
          ! grep -InE '(\.\./dwl|file:\.\./|link:\.\./|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook)' "${CHECK_FILES[@]}"
          ! grep -InE '(^|[^A-Za-z])dwl([^A-Za-z]|$)' "${CHECK_FILES[@]}"
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.vscode-test --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dwi-vsix
          path: apps/dwi-host/developer-work-intelligence-0.1.0.vsix

  readme-replay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Replay README from a true fresh clone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dwi
          git clone https://github.com/vinodsalina-cpu/dwi.git
          cd dwi
          git fetch origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node --version
          pnpm --version
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm --workspace-root exec node -e 'if (process.version !== "v24.18.0") process.exit(1)'
          pnpm -r --workspace-concurrency=1 exec sh -euc 'test "$(node --version)" = "v24.18.0"; test "$(pnpm --version)" = "11.17.0"'
          pnpm build
          pnpm test
          pnpm -r --workspace-concurrency=1 --if-present typecheck
          pnpm verify:fixtures
          pnpm schema:export
          git diff --exit-code -- docs/project-snapshot.schema.json
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/dwi-xvfb.log 2>&1 &
          export DISPLAY=:99
          DWI_VSCODE_VERSION=1.134.0 pnpm verify:extension
          stat -c 'README_REPLAY_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
