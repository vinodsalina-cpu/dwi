name: DWI recover and verify

on:
  push:
    branches:
      - codex/dwi-authoritative-rebuild

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node --version
          pnpm --version

      - name: Recover the DWI-only dependency closure from DWL
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vinodsalina-cpu/dwl.git "$RUNNER_TEMP/dwl"

          rm -rf apps/dwi-host apps/dwi-webview packages/dwi-core packages/domain/prompt-optimizer packages/domain/workspace
          mkdir -p apps packages/domain scripts tests/extension-host .github/workflows
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-host" apps/dwi-host
          cp -R "$RUNNER_TEMP/dwl/apps/dwi-webview" apps/dwi-webview
          cp -R "$RUNNER_TEMP/dwl/packages/dwi-core" packages/dwi-core
          cp -R "$RUNNER_TEMP/dwl/packages/domain/prompt-optimizer" packages/domain/prompt-optimizer
          cp -R "$RUNNER_TEMP/dwl/packages/domain/workspace" packages/domain/workspace
          cp "$RUNNER_TEMP/dwl/tsconfig.base.json" tsconfig.base.json
          cp "$RUNNER_TEMP/dwl/tsconfig.plugin.json" tsconfig.plugin.json
          rm -f .bootstrap

          cat > package.json <<'JSON'
          {
            "name": "@platform/dwi-root",
            "version": "0.1.0",
            "private": true,
            "packageManager": "pnpm@11.17.0",
            "engines": {
              "node": "24.18.0",
              "pnpm": "11.17.0"
            },
            "volta": {
              "node": "24.18.0",
              "pnpm": "11.17.0"
            },
            "scripts": {
              "build:deps": "pnpm --filter @platform/domain-prompt-optimizer build && pnpm --filter @platform/domain-workspace build && pnpm --filter @platform/dwi-core build && pnpm --filter @platform/dwi-webview build",
              "build": "pnpm build:deps && pnpm --filter @platform/dwi-host build",
              "test": "pnpm --filter @platform/domain-prompt-optimizer exec vitest run --config vitest.config.ts && pnpm --filter @platform/domain-workspace exec vitest run && pnpm --filter @platform/dwi-core exec vitest run && pnpm --filter @platform/dwi-host test && pnpm --filter @platform/dwi-webview test",
              "vsix": "pnpm build && node apps/dwi-host/scripts/package-vsix.mjs",
              "verify:extension": "node scripts/verify-installed-extension.mjs"
            },
            "devDependencies": {
              "@types/node": "^24.13.3",
              "@vscode/test-electron": "2.5.2",
              "typescript": "^5.9.3",
              "vitest": "~4.1.10"
            },
            "workspaces": [
              "apps/dwi-host",
              "apps/dwi-webview",
              "packages/dwi-core",
              "packages/domain/prompt-optimizer",
              "packages/domain/workspace"
            ]
          }
          JSON

          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - apps/dwi-host
            - apps/dwi-webview
            - packages/dwi-core
            - packages/domain/prompt-optimizer
            - packages/domain/workspace
          YAML

          printf '24.18.0\n' > .nvmrc
          cat > .tool-versions <<'EOF'
          nodejs 24.18.0
          pnpm 11.17.0
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          **/node_modules/
          dist/
          **/dist/
          coverage/
          **/coverage/
          .pnpm-store/
          .vite/
          **/.vite/
          *.tsbuildinfo
          *.vsix
          .DS_Store
          .env
          .env.*
          !.env.example
          .dwi/
          .dwi.*
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/dwi-host/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.description = 'Local, consent-based project intelligence with project-aware Prompt Optimizer and optional provider configuration.';
          manifest.engines.node = '24.18.0';
          manifest.capabilities = {
            untrustedWorkspaces: {
              supported: true,
              description: 'DWI reads only bounded manifest/config evidence after explicit project consent and does not execute workspace code.'
            }
          };
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          cat > scripts/verify-installed-extension.mjs <<'EOF'
          import { downloadAndUnzipVSCode, runTests } from '@vscode/test-electron';
          import { mkdtemp, mkdir, readdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';

          const root = resolve(fileURLToPath(new URL('..', import.meta.url)));
          const vsix = join(root, 'apps/dwi-host/developer-work-intelligence-0.1.0.vsix');
          const sandbox = await mkdtemp(join(tmpdir(), 'dwi-vscode-'));
          const extensionsDir = join(sandbox, 'extensions');
          const userDataDir = join(sandbox, 'user-data');
          const workspaceDir = join(sandbox, 'workspace');
          await Promise.all([mkdir(extensionsDir), mkdir(userDataDir), mkdir(workspaceDir)]);
          await writeFile(join(workspaceDir, 'package.json'), JSON.stringify({ name: 'dwi-smoke-workspace', private: true, scripts: { build: 'echo build', test: 'echo test' }, devDependencies: { typescript: '^5.9.3' } }, null, 2));
          await writeFile(join(workspaceDir, 'README.md'), '# DWI smoke workspace\n');

          const vscodeExecutablePath = await downloadAndUnzipVSCode('stable');
          const install = spawnSync(vscodeExecutablePath, ['--install-extension', vsix, '--force', '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir], { stdio: 'inherit', encoding: 'utf8' });
          if (install.status !== 0) throw new Error(`VSIX installation failed with status ${install.status}`);
          const installed = (await readdir(extensionsDir)).find((name) => name.startsWith('dwi-poc.developer-work-intelligence-'));
          if (!installed) throw new Error('Installed DWI extension directory was not found.');

          await runTests({
            vscodeExecutablePath,
            extensionDevelopmentPath: join(extensionsDir, installed),
            extensionTestsPath: join(root, 'tests/extension-host/index.cjs'),
            launchArgs: [workspaceDir, '--extensions-dir', extensionsDir, '--user-data-dir', userDataDir, '--disable-workspace-trust']
          });
          EOF

          cat > tests/extension-host/index.cjs <<'EOF'
          const assert = require('node:assert/strict');
          const vscode = require('vscode');

          async function run() {
            const extension = vscode.extensions.getExtension('dwi-poc.developer-work-intelligence');
            assert.ok(extension, 'DWI extension is discoverable after VSIX installation');
            await extension.activate();
            assert.equal(extension.isActive, true, 'DWI extension activates');
            const commands = await vscode.commands.getCommands(true);
            assert.ok(commands.includes('dwi.open'), 'dwi.open command is registered');
            await vscode.commands.executeCommand('dwi.open');
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          module.exports = { run };
          EOF

          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify DWI

          on:
            push:
            pull_request:

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24.18.0
                - name: Activate pinned pnpm
                  run: |
                    corepack enable
                    corepack prepare pnpm@11.17.0 --activate
                - name: Frozen install
                  run: pnpm install --frozen-lockfile
                - name: Unit verification
                  run: pnpm test
                - name: Build and package
                  run: pnpm vsix
                - name: Inspect VSIX
                  run: |
                    set -euo pipefail
                    VSIX=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
                    unzip -l "$VSIX" | tee /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/extension.js' /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/dwi-webview.js' /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/dwi-webview.css' /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/dwi-vsix.txt
                    grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/dwi-vsix.txt
                    ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env' /tmp/dwi-vsix.txt
                - name: Install and activate packaged extension
                  run: xvfb-run -a pnpm verify:extension
                - uses: actions/upload-artifact@v4
                  with:
                    name: dwi-vsix
                    path: apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          EOF

      - name: Generate the reduced lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Fresh frozen install and build
        run: |
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
          pnpm install --frozen-lockfile
          pnpm test
          pnpm vsix

      - name: Inspect packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          VSIX=apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          test -f "$VSIX"
          stat -c 'VSIX_BYTES=%s' "$VSIX"
          unzip -l "$VSIX" | tee /tmp/dwi-vsix.txt
          grep -q 'extension/dist/extension.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/dwi-webview.css' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/dwi-core/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-prompt-optimizer/dist/index.js' /tmp/dwi-vsix.txt
          grep -q 'extension/dist/node_modules/@platform/domain-workspace/dist/index.js' /tmp/dwi-vsix.txt
          ! grep -Eq 'node_modules/.*/src/|\.spec\.|coverage/|\.cache/|\.env' /tmp/dwi-vsix.txt

      - name: Install and activate the packaged VSIX
        run: xvfb-run -a pnpm verify:extension

      - name: Repository independence and public hygiene gates
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='dwi-recover-and-verify.yml' '(\.\./dwl|/Users/|/home/[A-Za-z0-9._-]+/|vinods-MacBook|file:\.\./|link:\.\./)' .
          ! find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='pnpm-lock.yaml' '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .

      - name: Write verified README
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Developer Workspace Intelligence (DWI)

          Developer Workspace Intelligence is a VS Code extension that builds a local, consent-based project brief from bounded workspace evidence, lets the developer confirm or correct that brief, composes project-aware prompt/tool guidance, and keeps DWI workspace state local. Provider configuration is optional; the core DWI flow remains deterministic and local.

          ## Prerequisites

          - Node.js **24.18.0**
          - pnpm **11.17.0**
          - VS Code **1.125.0 or newer**
          - Git

          The repository pins Node in `.nvmrc` and `.tool-versions`, and pins pnpm in `package.json`.

          ## Clone

          ```sh
          git clone https://github.com/vinodsalina-cpu/dwi.git
          cd dwi
          ```

          ## Select the pinned runtime

          With `nvm`:

          ```sh
          nvm install
          nvm use
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          ```

          Confirm the versions:

          ```sh
          node --version
          pnpm --version
          ```

          Expected: Node `v24.18.0` and pnpm `11.17.0`.

          ## Install dependencies

          ```sh
          pnpm install --frozen-lockfile
          ```

          ## Build DWI

          ```sh
          pnpm build
          ```

          This builds, in dependency order, the Prompt Optimizer domain, workspace domain, DWI core, React/Vite webview, and VS Code extension host. The host assembly step copies the built workspace packages and webview assets into the extension runtime directory.

          ## Build the VSIX

          ```sh
          pnpm vsix
          ```

          The installable extension is created at:

          ```text
          apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          ```

          ## Install in VS Code

          UI:

          1. Open VS Code.
          2. Open **Extensions**.
          3. Open the Extensions `...` menu.
          4. Choose **Install from VSIX...**.
          5. Select `apps/dwi-host/developer-work-intelligence-0.1.0.vsix`.
          6. Reload VS Code if prompted.

          CLI:

          ```sh
          code --install-extension apps/dwi-host/developer-work-intelligence-0.1.0.vsix --force
          ```

          ## Start DWI

          Open a project/workspace in VS Code, then either select the **Developer Work Intelligence** icon in the Activity Bar or run **DWI: Open Developer Work Intelligence** / **Open Developer Work Intelligence** from the Command Palette.

          ## What to expect

          Normal operation is:

          1. **Initial / consent** — DWI explains the bounded local evidence it may inspect. It does not scan the workspace before approval.
          2. **Brief** — after approval, DWI derives a local project brief from bounded manifests, workspace configuration, scripts, and approved evidence. You confirm or correct it.
          3. **Compose** — choose the DWI work modules to include. DWI compiles project-aware guidance using the confirmed brief.
          4. **Review / usable** — review the compiled candidate, record optional local feedback, and export a human-gated evaluation draft if desired.

          Multi-root workspaces require choosing a root. DWI stores managed journey state under `.dwi` in the selected project root and uses VS Code SecretStorage for an optional provider API key.

          ## Verification

          The repository's CI reproduces a frozen install, unit tests, build, VSIX packaging, package-content inspection, VSIX installation, extension activation, command registration, and opening the DWI view against a disposable workspace.

          To repeat the package installation/activation smoke test locally after `pnpm vsix`:

          ```sh
          pnpm verify:extension
          ```

          On Linux this requires a display server; CI runs it through `xvfb-run`.

          ## Troubleshooting

          **`pnpm install --frozen-lockfile` reports a lockfile mismatch**  
          Do not bypass the frozen install. Ensure the checkout is current and `pnpm --version` is exactly `11.17.0`. A manifest change requires intentionally regenerating and committing `pnpm-lock.yaml`.

          **The webview is blank or reports a missing asset**  
          Run `pnpm build` before packaging. `apps/dwi-host/dist/` must contain `extension.js`, `dwi-webview.js`, `dwi-webview.css`, and the assembled runtime workspace packages under `dist/node_modules/@platform/`.

          **DWI says to open a workspace first**  
          Open a folder or `.code-workspace` before approving project analysis. DWI deliberately does not create a project brief without a workspace root.

          **A multi-root workspace does not continue automatically**  
          Select the intended project root in DWI. DWI isolates `.dwi` state by selected root rather than merging unrelated roots.

          **Provider settings do not make a network call**  
          This is intentional. Saving provider configuration validates and stores settings/key material locally; the existing DWI implementation does not silently test or invoke a provider during setup.

          ## Agent Troubleshooting Context

          - Source/build closure: `apps/dwi-host` → `packages/dwi-core` + `packages/domain/workspace`; `packages/dwi-core` → `packages/domain/prompt-optimizer`; `apps/dwi-webview` → `packages/dwi-core`.
          - Webview build output: `dist/apps/dwi-webview/dwi-webview.js` and `dwi-webview.css`.
          - Host assembly: `apps/dwi-host/scripts/assemble.mjs` copies the webview assets plus built runtime workspace packages into `apps/dwi-host/dist/`.
          - Packaging: `apps/dwi-host/scripts/package-vsix.mjs` stages only the extension manifest/README, icon, and assembled `dist` tree, then uses `@vscode/vsce`.
          - VSIX output: `apps/dwi-host/developer-work-intelligence-0.1.0.vsix`.
          - Runtime entrypoint: `apps/dwi-host/dist/extension.js`; command `dwi.open`; view id `dwi-view`; activity container `dwi-sidebar`.
          - DWI has no build/runtime dependency on the old `dwl` checkout. The old repository was used only as the recovery source when this standalone repository was reconstructed.
          - Generated `dist`, coverage, caches, `node_modules`, `.dwi` runtime state, and `.vsix` files are intentionally ignored and must be reproducible from source.
          EOF

      - name: Commit recovered source and verified documentation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild

      - name: Prove README build commands from a fresh clone
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = 'v24.18.0'
          test "$(pnpm --version)" = '11.17.0'
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: dwi-vsix-recovery
          path: apps/dwi-host/developer-work-intelligence-0.1.0.vsix
