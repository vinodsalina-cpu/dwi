name: DWI recover v3

on:
  push:
    branches: [codex/dwi-authoritative-rebuild]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dwi-authoritative-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
      - name: Recover source using audited v2 recipe
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/dwi-recover-v2.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Recover DWI source closure"}; File.write("/tmp/recover.sh", s["run"])'
          bash -euo pipefail /tmp/recover.sh
      - name: Put pnpm 11 build policy in workspace settings
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'
          onlyBuiltDependencies:
            - '@swc/core'
            - '@vscode/vsce-sign'
            - keytar
          YAML
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));delete p.pnpm;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Generate reduced lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
      - name: Fresh frozen install, tests and package
        run: |
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist apps/dwi-host/*.vsix
          pnpm install --frozen-lockfile
          pnpm test
          pnpm vsix
      - name: Run VSIX inspection from audited recipe
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/dwi-recover-v2.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Inspect VSIX"}; File.write("/tmp/inspect.sh", s["run"])'
          bash -euo pipefail /tmp/inspect.sh
      - name: Install and activate packaged VSIX
        run: xvfb-run -a pnpm verify:extension
      - name: Run independence and public hygiene gates
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/dwi-recover-v2.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Independence and public hygiene"}; File.write("/tmp/hygiene.sh", s["run"])'
          bash -euo pipefail /tmp/hygiene.sh
      - name: Write README from verified recipe
        run: |
          ruby -e 'require "yaml"; y=YAML.load_file(".github/workflows/dwi-recover-v2.yml", aliases: true); s=y["jobs"]["recover"]["steps"].find{|x| x["name"]=="Write executable README"}; File.write("/tmp/readme.sh", s["run"])'
          bash -euo pipefail /tmp/readme.sh
      - name: Commit recovered repository
        run: |
          rm -rf node_modules dist apps/dwi-host/dist apps/dwi-webview/dist packages/dwi-core/dist packages/domain/prompt-optimizer/dist packages/domain/workspace/dist coverage apps/dwi-host/*.vsix
          rm -f .github/workflows/dwi-recover-and-verify.yml .github/workflows/dwi-recover-v2.yml .github/workflows/dwi-recover-v3.yml
          git config user.name 'DWI repository recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Recover complete self-contained DWI source'
          git push origin HEAD:codex/dwi-authoritative-rebuild
      - name: Fresh-clone README build gate
        run: |
          cd "$RUNNER_TEMP"
          rm -rf dwi-fresh
          git clone --depth 1 --branch codex/dwi-authoritative-rebuild https://github.com/vinodsalina-cpu/dwi.git dwi-fresh
          cd dwi-fresh
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.17.0"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm vsix
          test -f apps/dwi-host/developer-work-intelligence-0.1.0.vsix
          stat -c 'FRESH_CLONE_VSIX_BYTES=%s' apps/dwi-host/developer-work-intelligence-0.1.0.vsix
